x-app-environment: &app-environment
  DATABASE_URL: postgresql://admin:12345@shortener-db:5432/shortener_db
  REDIS_URL: redis://redis:6379
  REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-100}
  REDIS_URL_CACHE_TTL_SECONDS: ${REDIS_URL_CACHE_TTL_SECONDS:-86400}
  REDIS_NEGATIVE_CACHE_TTL_SECONDS: ${REDIS_NEGATIVE_CACHE_TTL_SECONDS:-60}
  CLICK_BATCH_SIZE: ${CLICK_BATCH_SIZE:-500}
  CLICK_BATCH_INTERVAL_MS: ${CLICK_BATCH_INTERVAL_MS:-5000}
  CLICK_QUEUE_MAX_LENGTH: ${CLICK_QUEUE_MAX_LENGTH:-1000000}

x-runtime-service: &runtime-service
  image: url-shortener-app:local
  build:
    context: .
    target: runtime
  environment: *app-environment
  networks:
    - shortener-network

services:
  shortener-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: shortener_db
    ports:
      - "3001:5432"
    volumes:
      - shortener-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shortener_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shortener-network

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - shortener-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shortener-network

  migrate:
    <<: *runtime-service
    profiles: ["app"]
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      shortener-db:
        condition: service_healthy

  api:
    <<: *runtime-service
    profiles: ["app"]
    environment:
      <<: *app-environment
      PORT: 5000
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CLICK_TRACKING_MODE: ${CLICK_TRACKING_MODE:-async}
    command: ["node", "dist/src/server.js"]
    ports:
      - "${APP_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const socket=net.connect(5000,'127.0.0.1');socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *runtime-service
    profiles: ["app"]
    command: ["node", "dist/src/worker.js"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  benchmark:
    image: url-shortener-tools:local
    build:
      context: .
      target: tools
    profiles: ["benchmark"]
    environment:
      BENCHMARK_TARGET_URL: ${BENCHMARK_TARGET_URL:-http://api:5000/replace-with-a-real-short-code}
      BENCHMARK_CONNECTIONS: ${BENCHMARK_CONNECTIONS:-50}
      BENCHMARK_DURATION_SECONDS: ${BENCHMARK_DURATION_SECONDS:-15}
    networks:
      - shortener-network

volumes:
  shortener-db-data:
  shortener-redis-data:

networks:
  shortener-network:
