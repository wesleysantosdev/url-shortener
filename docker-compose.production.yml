name: shrten

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shrten}
      POSTGRES_USER: ${POSTGRES_USER:-shrten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      private:

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      private:

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shrten}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@database:5432/${POSTGRES_DB:-shrten}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}@redis:6379
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-100}
      REDIS_URL_CACHE_TTL_SECONDS: ${REDIS_URL_CACHE_TTL_SECONDS:-86400}
      REDIS_NEGATIVE_CACHE_TTL_SECONDS: ${REDIS_NEGATIVE_CACHE_TTL_SECONDS:-60}
      CORS_ALLOWED_ORIGIN: https://${PRIMARY_DOMAIN:-shrten.pro}
      PUBLIC_SHORT_URL_BASE: https://${PRIMARY_DOMAIN:-shrten.pro}
      TRUST_PROXY_HOPS: 1
      RATE_LIMIT_IP_HASH_SECRET: ${RATE_LIMIT_IP_HASH_SECRET:?Set RATE_LIMIT_IP_HASH_SECRET in .env.production}
      SHORT_CODE_SECRET: ${SHORT_CODE_SECRET:?Set SHORT_CODE_SECRET in .env.production}
      CREATION_ATTEMPT_LIMIT: ${CREATION_ATTEMPT_LIMIT:-5}
      CREATION_ATTEMPT_WINDOW_SECONDS: ${CREATION_ATTEMPT_WINDOW_SECONDS:-60}
      CREATION_DAILY_LIMIT: ${CREATION_DAILY_LIMIT:-20}
      CREATION_DAILY_WINDOW_SECONDS: ${CREATION_DAILY_WINDOW_SECONDS:-86400}
      URL_RETENTION_DAYS: ${URL_RETENTION_DAYS:-180}
      URL_CLEANUP_INTERVAL_HOURS: ${URL_CLEANUP_INTERVAL_HOURS:-24}
      PORT: 5000
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node dist/src/server.js
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const socket=net.connect(5000,'127.0.0.1');socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      private:

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://${PRIMARY_DOMAIN:-shrten.pro}
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-shrten.pro}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
      private:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  private:
    internal: true
